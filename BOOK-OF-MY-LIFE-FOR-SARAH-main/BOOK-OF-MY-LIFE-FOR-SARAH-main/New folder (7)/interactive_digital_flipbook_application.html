<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A Lifetime of Silent Devotion — Dedicated to Sarah</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts for Romantic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #1c0512;
            --bg-overlay: rgba(38, 10, 26, 0.88);
            --book-cover-bg: linear-gradient(135deg, #800f2f 0%, #c9184a 50%, #590d22 100%);
            --book-cover-border: #e5b84b;
            --page-bg: #fff0f3;
            --page-text: #4a0e17;
            --page-border: #ffccd5;
            --accent-pink: #ff4d6d;
            --accent-gold: #e5b84b;
            --accent-gold-glow: rgba(229, 184, 75, 0.38);
            --spine-shadow: rgba(89, 13, 34, 0.35);
            --paper-shadow: rgba(40, 5, 18, 0.5);
            --font-serif: 'Cormorant Garamond', serif;
            --font-display: 'Playfair Display', serif;
            --font-script: 'Great Vibes', cursive;
        }

        .theme-soft-rose {
            --bg-canvas: #fce4ec;
            --bg-overlay: rgba(255, 240, 243, 0.88);
            --book-cover-bg: linear-gradient(135deg, #a4133c 0%, #ff4d6d 50%, #800f2f 100%);
            --book-cover-border: #e5b84b;
            --page-bg: #ffffff;
            --page-text: #4a0e17;
            --page-border: #ffccd5;
            --accent-pink: #c9184a;
            --accent-gold: #d5a638;
            --accent-gold-glow: rgba(213, 166, 56, 0.3);
            --spine-shadow: rgba(128, 15, 47, 0.2);
            --paper-shadow: rgba(128, 15, 47, 0.25);
        }

        .theme-midnight-velvet {
            --bg-canvas: #120309;
            --bg-overlay: rgba(25, 5, 15, 0.9);
            --book-cover-bg: linear-gradient(135deg, #38040e 0%, #590d22 50%, #25020a 100%);
            --book-cover-border: #e5b84b;
            --page-bg: #220710;
            --page-text: #ffccd5;
            --page-border: #590d22;
            --accent-pink: #ff758f;
            --accent-gold: #e5b84b;
            --accent-gold-glow: rgba(229, 184, 75, 0.3);
            --spine-shadow: rgba(0, 0, 0, 0.8);
            --paper-shadow: rgba(0, 0, 0, 0.7);
        }

        .theme-vintage-parchment {
            --bg-canvas: #2b1d14;
            --bg-overlay: rgba(43, 29, 20, 0.9);
            --book-cover-bg: linear-gradient(135deg, #5c1825 0%, #7a1f31 50%, #3d0d16 100%);
            --book-cover-border: #c99832;
            --page-bg: #fdf8eb;
            --page-text: #3d1c06;
            --page-border: #e6d3a7;
            --accent-pink: #c9184a;
            --accent-gold: #c99832;
            --accent-gold-glow: rgba(201, 152, 50, 0.3);
            --spine-shadow: rgba(61, 28, 6, 0.5);
            --paper-shadow: rgba(0, 0, 0, 0.6);
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--page-text);
            font-family: var(--font-serif);
            transition: background-color 0.5s ease, color 0.5s ease;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .font-script { font-family: var(--font-script); }
        .font-display { font-family: var(--font-display); }
        .font-serif { font-family: var(--font-serif); }

        .gold-foil-text {
            background: linear-gradient(115deg, #9b681c 0%, #f8e7a1 18%, #c8952d 34%, #fff4c4 48%, #b57c1f 64%, #f2d77e 82%, #9b681c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 1px 10px var(--accent-gold-glow);
            background-size: 180% 100%;
            animation: gold-shimmer 8s ease-in-out infinite alternate;
        }

        @keyframes gold-shimmer {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        .gold-border {
            border-color: var(--accent-gold);
            box-shadow: inset 0 0 0 3px rgba(255, 232, 161, 0.18), 0 0 18px var(--accent-gold-glow);
        }

        .book-viewport {
            perspective: 2200px;
            perspective-origin: 50% 50%;
        }

        .book-container {
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.45s ease;
            filter: drop-shadow(0 22px 26px rgba(25, 2, 13, 0.28));
        }

        .page-sheet {
            background-color: var(--page-bg);
            background-image: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.24), transparent 64%), linear-gradient(110deg, rgba(255, 143, 171, 0.025), transparent 24%, rgba(255, 255, 255, 0.12) 50%, transparent 78%);
            border: 1px solid var(--page-border);
            box-shadow: inset 0 0 40px rgba(128, 15, 47, 0.05), inset 0 0 0 5px rgba(255, 255, 255, 0.18), 0 10px 40px var(--paper-shadow);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            transform-origin: left center;
        }

        .right-page::after {
            content: "";
            position: absolute;
            top: 12px;
            right: 4px;
            bottom: 12px;
            width: 2px;
            border-radius: 2px;
            background: linear-gradient(180deg, transparent, var(--accent-gold), var(--accent-pink), var(--accent-gold), transparent);
            opacity: 0.55;
            pointer-events: none;
        }

        .fairytale-cover {
            isolation: isolate;
            background-image: radial-gradient(ellipse at 50% 35%, rgba(255, 180, 201, 0.2), transparent 55%), var(--book-cover-bg) !important;
        }

        .fairytale-cover::before,
        .fairytale-cover::after {
            content: "";
            position: absolute;
            inset: 8px;
            z-index: -1;
            border: 1px solid rgba(255, 225, 151, 0.76);
            border-radius: 0.72rem;
            pointer-events: none;
        }

        .fairytale-cover::after {
            inset: 15px;
            border-color: rgba(255, 225, 151, 0.32);
            border-radius: 0.55rem;
        }

        .cover-sparkles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            color: #ffe7a0;
            text-shadow: 0 0 12px rgba(255, 221, 133, 0.75);
        }

        .cover-sparkles::before,
        .cover-sparkles::after {
            position: absolute;
            font-family: var(--font-serif);
            font-size: 1.1rem;
            letter-spacing: 0.8rem;
            opacity: 0.78;
            content: "✦ · ✧";
        }

        .cover-sparkles::before {
            top: 17%;
            left: 50%;
            transform: translateX(-50%);
        }

        .cover-sparkles::after {
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
        }

        .chapter-ornament {
            height: 1px;
            width: min(10rem, 70%);
            margin: 0.65rem auto 0;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            position: relative;
        }

        .chapter-ornament::after {
            content: "✦";
            position: absolute;
            left: 50%;
            top: 50%;
            padding: 0 0.55rem;
            color: var(--accent-gold);
            background: var(--page-bg);
            transform: translate(-50%, -50%);
            font-size: 0.7rem;
        }

        .corner-cap {
            position: absolute;
            width: 22px;
            height: 22px;
            pointer-events: none;
            z-index: 25;
            opacity: 0.85;
        }
        .corner-top-left { top: 0; left: 0; border-top: 3px solid var(--accent-gold); border-left: 3px solid var(--accent-gold); border-top-left-radius: 6px; }
        .corner-top-right { top: 0; right: 0; border-top: 3px solid var(--accent-gold); border-right: 3px solid var(--accent-gold); border-top-right-radius: 6px; }
        .corner-bottom-left { bottom: 0; left: 0; border-bottom: 3px solid var(--accent-gold); border-left: 3px solid var(--accent-gold); border-bottom-left-radius: 6px; }
        .corner-bottom-right { bottom: 0; right: 0; border-bottom: 3px solid var(--accent-gold); border-right: 3px solid var(--accent-gold); border-bottom-right-radius: 6px; }

        .page-flipper {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            z-index: 35;
            transform-style: preserve-3d;
            transform-origin: left center;
            pointer-events: none;
            display: none;
        }

        .page-flipper.is-turning {
            will-change: transform;
        }

        .page-flipper.single-page-flip {
            width: 100%;
        }

        .page-flipper.flip-prev {
            left: 0;
            transform-origin: right center;
        }

        .page-flipper.flip-next {
            right: 0;
            transform-origin: left center;
        }

        .flipper-face {
            position: absolute;
            inset: 0;
            background-color: var(--page-bg);
            border: 1px solid var(--page-border);
            backface-visibility: hidden;
            overflow: hidden;
            box-shadow: 0 12px 35px var(--paper-shadow);
        }

        .flipper-face.back {
            transform: rotateY(180deg);
        }

        .spine-crease {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 28px;
            z-index: 28;
            pointer-events: none;
        }

        .spine-crease-dual {
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, 
                rgba(89, 13, 34, 0.32) 0%, 
                rgba(89, 13, 34, 0.1) 40%, 
                rgba(89, 13, 34, 0.32) 50%, 
                rgba(89, 13, 34, 0.1) 60%, 
                rgba(89, 13, 34, 0.32) 100%);
        }

        .spine-crease-single {
            left: 0;
            background: linear-gradient(90deg, rgba(89, 13, 34, 0.25) 0%, rgba(89, 13, 34, 0) 100%);
        }

        .ribbon-bookmark {
            position: absolute;
            top: -2px;
            right: 28px;
            width: 24px;
            height: 58px;
            background: linear-gradient(180deg, #ff4d6d 0%, #c9184a 100%);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
            box-shadow: 0 6px 14px rgba(128, 15, 47, 0.4);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 40;
            cursor: pointer;
        }

        .ribbon-bookmark:hover {
            height: 68px;
        }

        .drop-cap::first-letter {
            font-family: var(--font-display);
            font-size: 3.2em;
            float: left;
            line-height: 0.75;
            margin-right: 0.12em;
            margin-top: 0.08em;
            color: var(--accent-pink);
            font-weight: 700;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(201, 24, 74, 0.25);
            border-radius: 4px;
        }

        .dynamic-bend-shadow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.1s linear;
        }

        .eq-bar {
            width: 3px;
            background-color: var(--accent-pink);
            border-radius: 2px;
            animation: eqBounce 1.2s ease-in-out infinite alternate;
        }
        .eq-bar:nth-child(1) { height: 12px; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 18px; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 8px;  animation-delay: 0.2s; }
        .eq-bar:nth-child(4) { height: 15px; animation-delay: 0.4s; }

        @keyframes eqBounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.1); }
        }

        .eq-paused .eq-bar {
            animation-play-state: paused;
            transform: scaleY(0.3);
        }

        #bgCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body {
            background-image:
                radial-gradient(ellipse at 12% 18%, rgba(255, 117, 143, 0.18), transparent 34%),
                radial-gradient(ellipse at 88% 82%, rgba(255, 143, 171, 0.14), transparent 32%);
        }

        body::before,
        body::after {
            position: fixed;
            z-index: 1;
            color: rgba(255, 143, 171, 0.38);
            font-family: var(--font-script);
            pointer-events: none;
            animation: float-heart 6s ease-in-out infinite;
        }

        body::before {
            content: "♡";
            left: 2.5vw;
            top: 18vh;
            font-size: clamp(2rem, 5vw, 4rem);
        }

        body::after {
            content: "♥";
            right: 3vw;
            bottom: 15vh;
            font-size: clamp(1.5rem, 4vw, 3rem);
            animation-delay: -3s;
        }

        @keyframes float-heart {
            0%, 100% { transform: translateY(0) rotate(-8deg); }
            50% { transform: translateY(-12px) rotate(8deg); }
        }

        .music-player-frame {
            display: none;
        }

        #pageHearts {
            position: absolute;
            inset: 0;
            z-index: 31;
            overflow: hidden;
            pointer-events: none;
            border-radius: inherit;
        }

        .page-heart {
            position: absolute;
            color: #ff4d8d;
            font-family: Arial, sans-serif;
            line-height: 1;
            opacity: 0.24;
            pointer-events: auto;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
            text-shadow: 0 2px 12px rgba(255, 77, 141, 0.55);
            animation: page-heart-drift 7s ease-in-out infinite;
            will-change: transform, opacity;
        }

        .page-heart:nth-child(1) { left: 11%; top: 20%; font-size: 23px; animation-delay: -1.4s; }
        .page-heart:nth-child(2) { left: 83%; top: 28%; font-size: 19px; animation-delay: -4.2s; }
        .page-heart:nth-child(3) { left: 18%; top: 76%; font-size: 17px; animation-delay: -2.8s; }
        .page-heart:nth-child(4) { left: 76%; top: 70%; font-size: 25px; animation-delay: -5.5s; }
        .page-heart:nth-child(5) { left: 52%; top: 12%; font-size: 16px; animation-delay: -3.3s; }
        .page-heart:nth-child(6) { left: 60%; top: 88%; font-size: 20px; animation-delay: -0.5s; }
        .page-heart:nth-child(7) { left: 39%; top: 35%; font-size: 15px; animation-delay: -2.1s; }
        .page-heart:nth-child(8) { left: 91%; top: 52%; font-size: 18px; animation-delay: -4.8s; }
        .page-heart:nth-child(9) { left: 7%; top: 54%; font-size: 16px; animation-delay: -0.9s; }

        .page-heart.is-dragging {
            animation: none;
            opacity: 0.95;
            cursor: grabbing;
            z-index: 2;
            filter: drop-shadow(0 0 8px rgba(255, 77, 141, 0.9));
        }

        @keyframes page-heart-drift {
            0%, 100% { opacity: 0.18; transform: translate3d(0, 10px, 0) scale(0.82) rotate(-10deg); }
            50% { opacity: 0.52; transform: translate3d(7px, -14px, 0) scale(1.05) rotate(10deg); }
        }

        .stanza-card {
            position: relative;
            padding: 0.65rem 0.75rem;
            border: 1px solid rgba(201, 24, 74, 0.1);
            border-radius: 0.9rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.55), rgba(255, 204, 213, 0.16));
            box-shadow: 0 5px 16px rgba(89, 13, 34, 0.045);
        }

        .theme-midnight-velvet .stanza-card {
            background: linear-gradient(135deg, rgba(255, 204, 213, 0.08), rgba(89, 13, 34, 0.18));
            border-color: rgba(255, 204, 213, 0.12);
        }

        .theme-vintage-parchment .stanza-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(230, 211, 167, 0.2));
            border-color: rgba(125, 82, 32, 0.12);
        }

        @media (max-width: 640px) {
            body.h-full {
                min-height: 100vh;
                min-height: 100dvh;
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
                overscroll-behavior-y: contain;
            }

            #bookViewport {
                min-height: 0;
                padding: 0.5rem 0.5rem 5.75rem;
            }

            body.tts-active #bookViewport {
                padding-bottom: 11rem;
            }

            #bookStage {
                height: clamp(300px, 62vh, 660px);
                height: clamp(300px, 62dvh, 660px);
                min-height: 0;
                max-height: 660px;
                touch-action: pan-y pinch-zoom;
            }

            header {
                padding-top: max(0.5rem, env(safe-area-inset-top));
            }

            #rightPageSheet {
                border-radius: 1rem;
                border-left-width: 1px;
                border-right-width: 2px;
                box-shadow: inset -5px 0 10px rgba(89, 13, 34, 0.055), inset 0 0 0 5px rgba(255, 255, 255, 0.18), 0 10px 32px var(--paper-shadow);
            }

            #prevEdgeTap,
            #nextEdgeTap {
                display: none;
            }

            .page-heart {
                font-size: 19px;
            }

            .page-heart:nth-child(4) {
                font-size: 22px;
            }

            .page-sheet,
            .flipper-face {
                padding: 0.85rem;
            }

            .page-sheet {
                user-select: text;
                -webkit-user-select: text;
            }

            body.h-full > footer {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                padding: 0.5rem 0.75rem max(0.5rem, env(safe-area-inset-bottom));
                gap: 0.4rem;
                border-top-color: rgba(255, 143, 171, 0.25);
                box-shadow: 0 -10px 30px rgba(28, 5, 18, 0.18);
            }

            #pageNavigation {
                display: grid;
                grid-template-columns: 48px minmax(0, 1fr) 48px;
                gap: 0.5rem;
                align-items: center;
                width: 100%;
            }

            #pageNavigation > button {
                min-width: 44px;
                min-height: 48px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 1px solid rgba(255, 143, 171, 0.38);
                border-radius: 1rem;
                background: linear-gradient(145deg, rgba(255, 77, 141, 0.28), rgba(201, 24, 74, 0.22));
                box-shadow: 0 5px 14px rgba(89, 13, 34, 0.22);
            }

            body.h-full #viewModeBtn {
                display: none;
            }

            #pageNavigation > div {
                max-width: none;
                min-width: 0;
                flex-direction: row;
                gap: 0.5rem;
            }

            #pageNavigation > div > div {
                min-width: 80px;
            }

            #pageScrubber {
                min-height: 24px;
                touch-action: pan-x;
            }

            #ttsControlBar {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            #ttsControlBar > div:last-child {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .page-sheet {
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
            }
        }

        @media (max-width: 360px) {
            #pageNavigation {
                grid-template-columns: 44px minmax(0, 1fr) 44px;
                gap: 0.35rem;
            }

            #ttsControlBar {
                padding-inline: 0.65rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before,
            body::after,
            .page-heart {
                animation: none;
            }

            #bgCanvas {
                display: none;
            }

            .page-heart {
                opacity: 0.16;
            }

            .gold-foil-text {
                animation: none;
                background-position: 50% 50%;
            }
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between relative overflow-hidden select-none">

    <!-- Background Maastricht Concert Night Canvas -->
    <canvas id="bgCanvas"></canvas>

    <div class="w-full h-1 bg-rose-200/20 fixed top-0 left-0 z-50">
        <div id="readingProgress" class="h-full transition-all duration-300" style="width: 0%; background: linear-gradient(90deg, #ff8fab, #ff4d8d);"></div>
    </div>

    <!-- Main Navigation Bar -->
    <header class="w-full px-3 sm:px-5 py-2.5 flex items-center justify-between border-b border-rose-900/10 z-40 backdrop-blur-md relative" style="background-color: var(--bg-overlay);">
        <div class="flex items-center space-x-1.5 sm:space-x-3">
            <button id="tocBtn" class="p-2 rounded-xl hover:bg-rose-500/10 transition flex items-center space-x-1.5" title="Table of Contents">
                <i data-lucide="book-open" class="w-5 h-5 text-rose-500"></i>
                <span class="text-xs font-semibold hidden sm:inline">Contents</span>
            </button>
            <button id="bookmarkBtn" class="p-2 rounded-xl hover:bg-rose-500/10 transition flex items-center space-x-1.5" title="Saved Bookmarks">
                <i data-lucide="bookmark" class="w-5 h-5 text-rose-500"></i>
                <span class="text-xs font-semibold hidden sm:inline">Bookmarks</span>
            </button>
        </div>

        <div class="text-center truncate px-2 max-w-[38vw] sm:max-w-md">
            <h1 class="text-xs sm:text-sm font-bold tracking-widest uppercase truncate gold-foil-text font-display">A Lifetime of Silent Devotion</h1>
            <p id="headerChapterName" class="text-[11px] italic opacity-90 truncate gold-foil-text">Dedicated to Sarah</p>
        </div>

        <div class="flex items-center space-x-1 sm:space-x-2">
            <!-- Background song toggle -->
            <button id="musicToggleBtn" class="px-2.5 py-1.5 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-400/30 transition flex items-center space-x-2" title="Play or pause Sarah's song" aria-pressed="false">
                <div id="eqContainer" class="flex items-end space-x-0.5 h-4 eq-paused">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
                <span id="musicBtnLabel" class="text-[11px] font-bold text-rose-200 hidden md:inline">Sarah</span>

                                <p class="text-[10px] mt-0.5">Faith • Penance • Rebuilding • Unconditional Love</p>

                    `
                }
            ]
        };

        let currentPageIndex = 0;
        let isDualView = window.innerWidth >= 768;
        let userViewPreference = 'auto';
        let currentTheme = localStorage.getItem('silentDevotionTheme') || 'concert-night';
        let fontSizeScale = parseFloat(localStorage.getItem('silentDevotionFontSize')) || 1.0;
        let bookmarks = JSON.parse(localStorage.getItem('silentDevotionBookmarks')) || [];
        let isFxMuted = false;

        // Pointer/Touch drag physics state
        let isDragging = false;
        let isTrackingPointer = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragCurrentX = 0;
        let dragStartedAt = 0;
        let activePointerId = null;
        let draggedHeart = null;
        let heartDragOffsetX = 0;
        let heartDragOffsetY = 0;
        let isFlipping = false;

        // Background song player
        let audioCtx = null;
        let musicIsPlaying = false;
        let musicWantsPlayback = false;
        let songHasFadedIn = false;
        let songFadeTimer = null;
        const backgroundSong = document.getElementById('backgroundSong');
        backgroundSong.volume = 0;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function fadeSongIn() {
            if (songHasFadedIn || songFadeTimer) return;

            songFadeTimer = setInterval(() => {
                backgroundSong.volume = Math.min(backgroundSong.volume + 0.04, 1);
                if (backgroundSong.volume >= 1) {
                    clearInterval(songFadeTimer);
                    songFadeTimer = null;
                    songHasFadedIn = true;
                }
            }, 100);
        }

        function startSong() {
            musicWantsPlayback = true;
            updateMusicUI();

            backgroundSong.play().catch(() => {
                musicIsPlaying = false;
                musicWantsPlayback = false;
                updateMusicUI();
            });
        }

        function stopSong() {
            musicWantsPlayback = false;
            backgroundSong.pause();
        }

        function toggleSong() {
            if (musicIsPlaying || musicWantsPlayback) stopSong();
            else startSong();
        }

        backgroundSong.addEventListener('play', () => {
            musicIsPlaying = true;
            if (!songHasFadedIn) fadeSongIn();
            updateMusicUI();
        });

        backgroundSong.addEventListener('pause', () => {
            musicIsPlaying = false;
            musicWantsPlayback = false;
            if (songFadeTimer) {
                clearInterval(songFadeTimer);
                songFadeTimer = null;
            }
            updateMusicUI();
        });

        backgroundSong.addEventListener('error', () => {
            musicIsPlaying = false;
            musicWantsPlayback = false;
            if (songFadeTimer) {
                clearInterval(songFadeTimer);
                songFadeTimer = null;
            }
            updateMusicUI();
        });

        function updateMusicUI() {
            const eq = document.getElementById('eqContainer');
            const label = document.getElementById('musicBtnLabel');
            const button = document.getElementById('musicToggleBtn');
            if (musicIsPlaying || musicWantsPlayback) {
                if (eq) eq.classList.remove('eq-paused');
                if (label) label.textContent = musicIsPlaying ? 'Playing' : 'Starting…';
                if (button) button.setAttribute('aria-pressed', 'true');
            } else {
                if (eq) eq.classList.add('eq-paused');
                if (label) label.textContent = 'Sarah';
                if (button) button.setAttribute('aria-pressed', 'false');
            }
        }

        function playPaperSound() {
            if (isFxMuted) return;
            initAudioContext();
            if (!audioCtx) return;

            try {
                const bufferSize = audioCtx.sampleRate * 0.16;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.8);
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1100, audioCtx.currentTime);
                filter.Q.setValueAtTime(1.8, audioCtx.currentTime);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                noise.start();
            } catch (e) {}
        }

        function updateLayoutMode() {

        function renderPages() {
            const totalPages = BOOK_DATA.pages.length;

            if (currentPageIndex >= totalPages) currentPageIndex = totalPages - 1;

            let leftIdx = isDualView ? (currentPageIndex % 2 === 0 ? currentPageIndex - 1 : currentPageIndex) : -1;

            if (rightIdx >= 0 && rightIdx < totalPages) {
                renderSinglePageHTML(rightPageContent, BOOK_DATA.pages[rightIdx]);

            if (isDualView) {

                    leftChapterFooter.textContent = BOOK_DATA.pages[leftIdx].chapter || "";

            pageScrubber.max = totalPages;
            pageScrubber.value = currentPageIndex + 1;
            pageIndicator.textContent = `Page ${currentPageIndex + 1} of ${totalPages}`;
            
            const progressPct = ((currentPageIndex + 1) / totalPages) * 100;

        function renderSinglePageHTML(container, pageData) {

        function turnPage(direction) {
            if (isFlipping) return;

            const totalPages = BOOK_DATA.pages.length;
            const step = isDualView ? 2 : 1;

            if (direction === 'next' && currentPageIndex + step >= totalPages && currentPageIndex === totalPages - 1) return;
            if (direction === 'prev' && currentPageIndex <= 0) return;

            if (!musicWantsPlayback) startSong();

            isFlipping = true;
            playPaperSound();

            if (isSpeaking) {
                synth.cancel();
                isSpeaking = false;
                updateTTSUI();
            }

            const targetIndex = direction === 'next' ? 
                Math.min(totalPages - 1, currentPageIndex + step) : 
                Math.max(0, currentPageIndex - step);

            pageFlipper.style.display = 'block';
            pageFlipper.className = `page-flipper flip-${direction}${isDualView ? '' : ' single-page-flip'}`;

            if (direction === 'next') {
                renderSinglePageHTML(flipperFrontContent, BOOK_DATA.pages[currentPageIndex]);
                renderSinglePageHTML(flipperBackContent, BOOK_DATA.pages[targetIndex]);
            } else {
                renderSinglePageHTML(flipperFrontContent, BOOK_DATA.pages[targetIndex]);
                renderSinglePageHTML(flipperBackContent, BOOK_DATA.pages[currentPageIndex]);
            }

            const rotationDegree = direction === 'next' ? -180 : 180;
            pageFlipper.classList.add('is-turning');
            void pageFlipper.offsetWidth;
            const pageTurnDuration = window.matchMedia('(prefers-reduced-motion: reduce)').matches
                ? 0
                : (isDualView ? 640 : 720);
            pageFlipper.style.transition = `transform ${pageTurnDuration}ms cubic-bezier(0.22, 0.72, 0.2, 1)`;
            pageFlipper.style.transform = `rotateY(${rotationDegree}deg)`;

            setTimeout(() => {
                currentPageIndex = targetIndex;
                pageFlipper.style.transition = 'none';
                pageFlipper.style.transform = 'rotateY(0deg)';
                pageFlipper.style.display = 'none';
                pageFlipper.classList.remove('is-turning');
                isFlipping = false;
                renderPages();
            }, pageTurnDuration);
        }

        function handlePointerDown(e) {
            if (isFlipping || !e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
            if (e.target.closest('button, input, select, textarea, a, .page-heart')) return;

            isTrackingPointer = true;
            isDragging = false;
            activePointerId = e.pointerId;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            dragCurrentX = dragStartX;
            dragStartedAt = performance.now();
        }

        function handlePointerMove(e) {
            if (!isTrackingPointer || e.pointerId !== activePointerId) return;

            dragCurrentX = e.clientX;
            const deltaX = dragCurrentX - dragStartX;
            const deltaY = e.clientY - dragStartY;

            if (!isDragging) {
                if (Math.abs(deltaY) > 12 && Math.abs(deltaY) > Math.abs(deltaX)) {
                    isTrackingPointer = false;
                    activePointerId = null;
                    return;
                }
                if (Math.abs(deltaX) < 12 || Math.abs(deltaX) <= Math.abs(deltaY) * 1.15) return;
                isDragging = true;
                bendShadowOverlay.style.opacity = '0.3';
            }

            if (e.cancelable) e.preventDefault();

            const dragRatio = Math.max(-1, Math.min(1, deltaX / (bookStage.clientWidth * 0.5)));
            const previewAngle = dragRatio * 28;
            bookStage.style.transform = `rotateY(${previewAngle * 0.12}deg) translateX(${dragRatio * 12}px)`;
            bendShadowOverlay.style.background = deltaX < 0
                ? `linear-gradient(90deg, transparent 60%, rgba(255, 77, 141, ${Math.abs(dragRatio) * 0.3}) 100%)`
                : `linear-gradient(270deg, transparent 60%, rgba(255, 77, 141, ${Math.abs(dragRatio) * 0.3}) 100%)`;
            bendShadowOverlay.style.opacity = Math.abs(dragRatio).toString();
        }

        function handlePointerUp(e, cancelled = false) {
            if (!isTrackingPointer || e.pointerId !== activePointerId) return;

            isTrackingPointer = false;
            activePointerId = null;
            const wasDragging = isDragging;
            isDragging = false;
            const deltaX = dragCurrentX - dragStartX;
            const elapsed = Math.max(1, performance.now() - dragStartedAt);
            const velocity = deltaX / elapsed;
            const threshold = Math.max(38, Math.min(70, bookStage.clientWidth * 0.14));

            bookStage.style.transform = 'rotateY(0deg) translateX(0px)';
            bendShadowOverlay.style.opacity = '0';
            if (cancelled || !wasDragging) return;

            if (deltaX < -threshold || (deltaX < -24 && velocity < -0.55)) turnPage('next');
            else if (deltaX > threshold || (deltaX > 24 && velocity > 0.55)) turnPage('prev');
        }

        function handleHeartPointerDown(e) {
            const heart = e.target.closest('.page-heart');
            if (!heart || !e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;

            e.preventDefault();
            e.stopPropagation();
            draggedHeart = heart;
            const heartRect = heart.getBoundingClientRect();
            heartDragOffsetX = e.clientX - heartRect.left;
            heartDragOffsetY = e.clientY - heartRect.top;
            heart.classList.add('is-dragging');
            heart.setPointerCapture(e.pointerId);
        }

        function handleHeartPointerMove(e) {
            if (!draggedHeart || !draggedHeart.hasPointerCapture(e.pointerId)) return;
            e.preventDefault();
            const bounds = pageHearts.getBoundingClientRect();
            const heartWidth = draggedHeart.offsetWidth;
            const heartHeight = draggedHeart.offsetHeight;
            const left = Math.max(0, Math.min(bounds.width - heartWidth, e.clientX - bounds.left - heartDragOffsetX));
            const top = Math.max(0, Math.min(bounds.height - heartHeight, e.clientY - bounds.top - heartDragOffsetY));
            draggedHeart.style.left = `${left}px`;
            draggedHeart.style.top = `${top}px`;
        }

        function handleHeartPointerUp(e) {
            if (!draggedHeart || !draggedHeart.hasPointerCapture(e.pointerId)) return;
            draggedHeart.classList.remove('is-dragging');
            draggedHeart.releasePointerCapture(e.pointerId);
            draggedHeart = null;
        }

            document.body.className = "h-full flex flex-col justify-between relative overflow-hidden select-none";

        function toggleBookmark() {

            if (idx > -1) bookmarks.splice(idx, 1);

        function jumpToPage(pageNum) {
            currentPageIndex = pageNum - 1;
            renderPages();
            closeAllDrawers();

        // Text To Speech
        let synth = window.speechSynthesis;
        let isSpeaking = false;
        let speechRate = 0.9;
        let speechPitch = 0.82;
        let speechVoices = [];
        let selectedVoiceURI = localStorage.getItem('silentDevotionVoice') || '';

        function getPreferredVoice(voices) {
            const englishVoices = voices.filter(voice => voice.lang.toLowerCase().startsWith('en'));
            const preferred = englishVoices.length ? englishVoices : voices;
            const masculineIndicators = /male|man|guy|david|james|daniel|george|ryan|christopher|mark|alex/i;
            const feminineIndicators = /female|woman|zira|samantha|victoria|karen|susan|aria|jenny/i;
            return preferred.find(voice => masculineIndicators.test(voice.name) && !feminineIndicators.test(voice.name))
                || preferred.find(voice => !feminineIndicators.test(voice.name))
                || preferred[0]
                || null;
        }

        function refreshSpeechVoices() {
            if (!synth) return;
            speechVoices = synth.getVoices();
            const voiceSelect = document.getElementById('ttsVoiceSelect');
            if (!voiceSelect) return;

            const preferredVoice = getPreferredVoice(speechVoices);
            if (!selectedVoiceURI && preferredVoice) selectedVoiceURI = preferredVoice.voiceURI;

            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = 'Best available voice';
            voiceSelect.replaceChildren(defaultOption);
            speechVoices.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.voiceURI;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
            voiceSelect.value = speechVoices.some(voice => voice.voiceURI === selectedVoiceURI) ? selectedVoiceURI : '';
        }

        function toggleTTS() {
            if (!synth) return;
            if (isSpeaking) {
                synth.cancel();
                isSpeaking = false;
                updateTTSUI();
            } else {
                speakActivePage();
            }
        }

        function speakActivePage() {
            if (!synth) return;
            synth.cancel();

            const p = BOOK_DATA.pages[currentPageIndex];
            if (!p) return;
            let text = "";
            if (p.type === 'cover') text = `${p.title}. ${p.subtitle}. ${p.dedication}`;
            else if (p.type === 'poem') text = `${p.chapter}. ${p.title}. ` + p.stanzas.map(s => s.replace(/<br>/g, ' ')).join(' ');
            else {
                const tmp = document.createElement('div');
                tmp.innerHTML = p.content || "";
                text = tmp.textContent || tmp.innerText || "";
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = speechRate;
            utterance.pitch = speechPitch;
            const voice = speechVoices.find(item => item.voiceURI === selectedVoiceURI) || getPreferredVoice(speechVoices);
            if (voice) {
                utterance.voice = voice;
                utterance.lang = voice.lang;
            } else {
                utterance.lang = 'en-US';
            }
            utterance.onend = () => { isSpeaking = false; updateTTSUI(); };
            utterance.onerror = () => { isSpeaking = false; updateTTSUI(); };

            synth.speak(utterance);
            isSpeaking = true;
            updateTTSUI();
        }

        function updateTTSUI() {
            const bar = document.getElementById('ttsControlBar');
            if (isSpeaking) bar.classList.remove('hidden');
            else bar.classList.add('hidden');
            document.body.classList.toggle('tts-active', isSpeaking);
        }

        function triggerHeartVowEffect() {
            const msg = document.getElementById('vowResponseMsg');
            if (msg) msg.classList.remove('opacity-0');
            for (let i = 0; i < 25; i++) {
                particles.push(new Particle(true));
            }
        }

        function closeAllDrawers() {
            tocDrawer.classList.add('-translate-x-full');
            bookmarksDrawer.classList.add('-translate-x-full');
            themeDrawer.classList.add('translate-x-full');
            drawerBackdrop.classList.add('hidden');
        }

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor(burst = false) {
                this.reset(burst);
            }

            reset(burst = false) {
                this.x = burst ? window.innerWidth / 2 + (Math.random() * 200 - 100) : Math.random() * window.innerWidth;
                this.y = burst ? window.innerHeight / 2 + (Math.random() * 200 - 100) : Math.random() * window.innerHeight;
                this.size = Math.random() * 8 + 6;
                this.speedY = burst ? Math.random() * 1.2 + 0.6 : Math.random() * 0.35 + 0.12;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.02;
                this.opacity = Math.random() * 0.28 + 0.12;
                this.color = ['#ff4d8d', '#ff8fab', '#ffc2d1'][Math.floor(Math.random() * 3)];
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.angle += this.spin;

                if (this.y > canvas.height + 20) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.opacity;

                ctx.beginPath();
                ctx.moveTo(0, this.size * 0.85);
                ctx.bezierCurveTo(-this.size * 1.5, -this.size * 0.1, -this.size * 0.9, -this.size, 0, -this.size * 0.35);
                ctx.bezierCurveTo(this.size * 0.9, -this.size, this.size * 1.5, -this.size * 0.1, 0, this.size * 0.85);
                ctx.fillStyle = this.color;
                ctx.fill();

                ctx.restore();
            }
        }

        function initParticles() {
            resizeCanvas();
            particles = [];
            for (let i = 0; i < 26; i++) {
                particles.push(new Particle());
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateCanvas);
        }

        function bindEvents() {
            // Book touch / pointer events
            bookStage.addEventListener('pointerdown', handlePointerDown);
            window.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);
            window.addEventListener('pointercancel', (e) => handlePointerUp(e, true));
            pageHearts.addEventListener('pointerdown', handleHeartPointerDown);
            pageHearts.addEventListener('pointermove', handleHeartPointerMove);
            pageHearts.addEventListener('pointerup', handleHeartPointerUp);
            pageHearts.addEventListener('pointercancel', handleHeartPointerUp);

            document.getElementById('prevEdgeTap').addEventListener('click', () => turnPage('prev'));
            document.getElementById('nextEdgeTap').addEventListener('click', () => turnPage('next'));
            prevBtn.addEventListener('click', () => turnPage('prev'));
            nextBtn.addEventListener('click', () => turnPage('next'));

            // Keyboard navigation
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') turnPage('prev');
                if (e.key === 'ArrowRight') turnPage('next');
            });

            // Scrubber
            pageScrubber.addEventListener('input', (e) => {
                const nextPageIndex = parseInt(e.target.value, 10) - 1;
                if (nextPageIndex !== currentPageIndex && !musicWantsPlayback) startSong();
                currentPageIndex = nextPageIndex;
                renderPages();
            });

            // View mode toggle
            viewModeBtn.addEventListener('click', () => {
                if (userViewPreference === 'auto') userViewPreference = isDualView ? 'single' : 'dual';
                else if (userViewPreference === 'dual') userViewPreference = 'single';
                else userViewPreference = 'dual';
                updateLayoutMode();
            });

            // Music Widget Button
            document.getElementById('musicToggleBtn').addEventListener('click', toggleSong);

            // FX sound toggle
            document.getElementById('soundToggleBtn').addEventListener('click', () => {
                isFxMuted = !isFxMuted;
                document.getElementById('soundIcon').setAttribute('data-lucide', isFxMuted ? 'volume-x' : 'sparkles');
                lucide.createIcons();
            });

            // TTS
            document.getElementById('ttsPlayBtn').addEventListener('click', toggleTTS);
            document.getElementById('ttsPauseBtn').addEventListener('click', () => {
                if (synth) synth.cancel();
                isSpeaking = false;
                updateTTSUI();
            });
            document.getElementById('ttsRateSelect').addEventListener('change', (e) => {
                speechRate = parseFloat(e.target.value);
                if (isSpeaking) speakActivePage();
            });
            document.getElementById('ttsVoiceSelect').addEventListener('change', (e) => {
                selectedVoiceURI = e.target.value;
                localStorage.setItem('silentDevotionVoice', selectedVoiceURI);
                if (isSpeaking) speakActivePage();
            });
            if (synth) {
                refreshSpeechVoices();
                synth.onvoiceschanged = refreshSpeechVoices;
            }

            // Bookmark Ribbon
            activeRibbonBookmark.addEventListener('click', toggleBookmark);

            // Drawers
            document.getElementById('tocBtn').addEventListener('click', () => {
                renderTOC();
                tocDrawer.classList.remove('-translate-x-full');
                drawerBackdrop.classList.remove('hidden');
            });

            document.getElementById('bookmarkBtn').addEventListener('click', () => {
                renderBookmarksList();
                bookmarksDrawer.classList.remove('-translate-x-full');
                drawerBackdrop.classList.remove('hidden');
            });

            document.getElementById('themeCustomizerBtn').addEventListener('click', () => {
                themeDrawer.classList.remove('translate-x-full');
                drawerBackdrop.classList.remove('hidden');
            });

            document.getElementById('closeTocBtn').addEventListener('click', closeAllDrawers);
            document.getElementById('closeBookmarksBtn').addEventListener('click', closeAllDrawers);
            document.getElementById('closeThemeBtn').addEventListener('click', closeAllDrawers);
            drawerBackdrop.addEventListener('click', closeAllDrawers);

            // Themes
            document.querySelectorAll('.theme-select-btn').forEach(btn => {
                btn.addEventListener('click', () => applyTheme(btn.getAttribute('data-theme')));
            });

            // Font sizing
            document.getElementById('fontIncBtn').addEventListener('click', () => {
                if (fontSizeScale < 1.35) {
                    fontSizeScale += 0.08;
                    document.getElementById('fontSizeLabel').textContent = `${Math.round(fontSizeScale * 100)}%`;
                    localStorage.setItem('silentDevotionFontSize', fontSizeScale);
                    renderPages();
                }
            });

            document.getElementById('fontDecBtn').addEventListener('click', () => {
                if (fontSizeScale > 0.75) {
                    fontSizeScale -= 0.08;
                    document.getElementById('fontSizeLabel').textContent = `${Math.round(fontSizeScale * 100)}%`;
                    localStorage.setItem('silentDevotionFontSize', fontSizeScale);
                    renderPages();
                }
            });

            document.getElementById('fontResetBtn').addEventListener('click', () => {
                fontSizeScale = 1.0;
                document.getElementById('fontSizeLabel').textContent = '100%';
                localStorage.setItem('silentDevotionFontSize', fontSizeScale);
                renderPages();
            });

            window.addEventListener('resize', () => {
                resizeCanvas();
                updateLayoutMode();
            });
        }

        // Window Load Entry point
        window.onload = function() {
            lucide.createIcons();
            applyTheme(currentTheme);
            initParticles();
            animateCanvas();
            bindEvents();
            updateLayoutMode();
            renderTOC();
        };
    </script>
</body>
</html>
