<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Lifetime of Silent Devotion — Dedicated to Sarah</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            background: linear-gradient(135deg, #1a0a15 0%, #2d0f1f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            background: rgba(28, 5, 18, 0.95);
            border-radius: 20px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            border: 2px solid rgba(229, 184, 75, 0.4);
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 25px 20px 15px;
            background: rgba(10, 5, 12, 0.9);
            border-bottom: 1px solid rgba(229, 184, 75, 0.2);
        }

        .header h1 {
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            letter-spacing: 2px;
            color: #e5b84b;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .header p {
            font-size: 0.9rem;
            color: #ff4d6d;
            letter-spacing: 1px;
            font-style: italic;
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .book {
            width: 100%;
            max-width: 900px;
            height: 100%;
            background: linear-gradient(135deg, #a4133c 0%, #ff4d6d 50%, #7d0a2d 100%);
            border-radius: 15px;
            border: 3px solid #e5b84b;
            box-shadow: 
                inset 0 0 0 2px rgba(255, 232, 161, 0.3),
                0 30px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .book::before {
            content: '';
            position: absolute;
            inset: 15px;
            border: 1px solid rgba(255, 221, 151, 0.5);
            border-radius: 12px;
            pointer-events: none;
            z-index: 1;
        }

        .page-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            position: relative;
            z-index: 2;
        }

        .page {
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .chapter-title {
            font-size: clamp(2rem, 4vw, 3.2rem);
            color: #fff0f3;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .poem-text {
            font-size: clamp(1.4rem, 2.5vw, 2rem);
            line-height: 1.8;
            color: #f7e3e4;
            max-width: 700px;
            margin: 0 auto;
            letter-spacing: 0.5px;
        }

        .poem-text p {
            margin-bottom: 12px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            background: rgba(10, 5, 12, 0.9);
            border-top: 1px solid rgba(229, 184, 75, 0.2);
        }

        button {
            background: rgba(229, 184, 75, 0.15);
            border: 1px solid rgba(229, 184, 75, 0.5);
            color: #e5b84b;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.4rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover:not(:disabled) {
            background: rgba(229, 184, 75, 0.35);
            transform: scale(1.1);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-indicator {
            font-size: 0.95rem;
            color: #e5b84b;
            letter-spacing: 1px;
            min-width: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>A Lifetime of Silent Devotion</h1>
            <p>Dedicated to Sarah</p>
        </div>

        <div class="content">
            <div class="book">
                <div class="page-wrapper">
                    <div class="page">
                        <h2 id="title" class="chapter-title">Chapter 1</h2>
                        <div id="content" class="poem-text"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="prev" onclick="previousPage()">❮</button>
            <div class="page-indicator">
                <span id="current">1</span> / <span id="total">6</span>
            </div>
            <button id="next" onclick="nextPage()">❯</button>
        </div>
    </div>

    <script>
        const chapters = [
            {
                title: 'Chapter 1',
                content: [
                    'There was a silence in the room that felt like prayer,',
                    'a quiet kind of devotion that wrapped itself around us',
                    'without asking for anything but presence.',
                    '',
                    'I learned then that love often speaks in stillness.',
                    'In the way a hand stays warm long after it is gone.',
                    'In the way a heart keeps a name even when the world is loud.'
                ]
            },
            {
                title: 'Chapter 2',
                content: [
                    'I began to notice the little miracles of you:',
                    'the soft way your laughter caught in the air,',
                    'the grace in your patience,',
                    'the gentleness in your eyes,',
                    '',
                    'the way my thoughts turned toward you',
                    'before I had even realized',
                    'I was looking for home.'
                ]
            },
            {
                title: 'Chapter 3',
                content: [
                    'Some loves arrive like thunder and leave like rain,',
                    'but yours arrived like a lantern in winter.',
                    '',
                    'It did not ask for spectacle.',
                    'It simply glowed, steady and sincere,',
                    'teaching me how to love without fear',
                    'and how to keep a promise in silence.'
                ]
            },
            {
                title: 'Chapter 4',
                content: [
                    'I carried you in the spaces between words,',
                    'in the pauses between heartbeats,',
                    'in the ache of the unspoken.',
                    '',
                    'You were not a chapter I finished.',
                    'You were the breath I was learning to live in.',
                    '',
                    'And every day I found myself more devoted',
                    'to the person who made my soul feel seen.'
                ]
            },
            {
                title: 'Chapter 5',
                content: [
                    'There is a kind of love that does not need applause,',
                    'only faithfulness.',
                    '',
                    'A love that waits without bitterness,',
                    'that survives distance, confusion, and time,',
                    'because it was built with tenderness and truth.',
                    '',
                    'That is what I have come to know of my devotion to you:',
                    'it is quiet, deep, and unwavering,',
                    'like the moon to the tide.'
                ]
            },
            {
                title: 'The Last Chapter',
                content: [
                    'If I could, I would open my chest and place',
                    'my heart in your hands,',
                    'not to shock you,',
                    'not to prove anything dramatic',
                    'but so you could feel it yourself.',
                    '',
                    'Feel how it trembles at your name.',
                    'How it races when you come close.',
                    'How every single beat whispers you.',
                    '',
                    'Because maybe then you would understand',
                    'that this isn\'t just love I speak of—',
                    'it\'s something carved into me,',
                    'something that lives and breathes',
                    'only for you.'
                ]
            }
        ];

        let currentPage = 0;

        function renderPage() {
            const chapter = chapters[currentPage];
            document.getElementById('title').textContent = chapter.title;
            document.getElementById('content').innerHTML = chapter.content
                .map(line => line ? `<p>${line}</p>` : '<p style="height: 12px;"></p>')
                .join('');
            document.getElementById('current').textContent = currentPage + 1;
            
            document.getElementById('prev').disabled = currentPage === 0;
            document.getElementById('next').disabled = currentPage === chapters.length - 1;
        }

        function nextPage() {
            if (currentPage < chapters.length - 1) {
                currentPage++;
                renderPage();
            }
        }

        function previousPage() {
            if (currentPage > 0) {
                currentPage--;
                renderPage();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') previousPage();
        });

        renderPage();
    </script>
</body>
</html>
