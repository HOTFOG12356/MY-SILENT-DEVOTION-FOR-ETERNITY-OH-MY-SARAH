<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A Lifetime of Silent Devotion — Dedicated to Sarah</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts for Romantic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #1c0512;
            --bg-overlay: rgba(38, 10, 26, 0.88);
            --book-cover-bg: linear-gradient(135deg, #800f2f 0%, #c9184a 50%, #590d22 100%);
            --book-cover-border: #e5b84b;
            --page-bg: #fff0f3;
            --page-text: #4a0e17;
            --page-border: #ffccd5;
            --accent-pink: #ff4d6d;
            --accent-gold: #e5b84b;
            --accent-gold-glow: rgba(229, 184, 75, 0.38);
            --spine-shadow: rgba(89, 13, 34, 0.35);
            --paper-shadow: rgba(40, 5, 18, 0.5);
            --font-serif: 'Cormorant Garamond', serif;
            --font-display: 'Playfair Display', serif;
            --font-script: 'Great Vibes', cursive;
        }

        .theme-soft-rose {
            --bg-canvas: #fce4ec;
            --bg-overlay: rgba(255, 240, 243, 0.88);
            --book-cover-bg: linear-gradient(135deg, #a4133c 0%, #ff4d6d 50%, #800f2f 100%);
            --book-cover-border: #e5b84b;
            --page-bg: #ffffff;
            --page-text: #4a0e17;
            --page-border: #ffccd5;
            --accent-pink: #c9184a;
            --accent-gold: #d5a638;
            --accent-gold-glow: rgba(213, 166, 56, 0.3);
            --spine-shadow: rgba(128, 15, 47, 0.2);
            --paper-shadow: rgba(128, 15, 47, 0.25);
        }

        .theme-midnight-velvet {
            --bg-canvas: #120309;
            --bg-overlay: rgba(25, 5, 15, 0.9);
            --book-cover-bg: linear-gradient(135deg, #38040e 0%, #590d22 50%, #25020a 100%);
            --book-cover-border: #e5b84b;
            --page-bg: #220710;
            --page-text: #ffccd5;
            --page-border: #590d22;
            --accent-pink: #ff758f;
            --accent-gold: #e5b84b;
            --accent-gold-glow: rgba(229, 184, 75, 0.3);
            --spine-shadow: rgba(0, 0, 0, 0.8);
            --paper-shadow: rgba(0, 0, 0, 0.7);
        }

        .theme-vintage-parchment {
            --bg-canvas: #2b1d14;
            --bg-overlay: rgba(43, 29, 20, 0.9);
            --book-cover-bg: linear-gradient(135deg, #5c1825 0%, #7a1f31 50%, #3d0d16 100%);
            --book-cover-border: #c99832;
            --page-bg: #fdf8eb;
            --page-text: #3d1c06;
            --page-border: #e6d3a7;
            --accent-pink: #c9184a;
            --accent-gold: #c99832;
            --accent-gold-glow: rgba(201, 152, 50, 0.3);
            --spine-shadow: rgba(61, 28, 6, 0.5);
            --paper-shadow: rgba(0, 0, 0, 0.6);
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--page-text);
            font-family: var(--font-serif);
            transition: background-color 0.5s ease, color 0.5s ease;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .font-script { font-family: var(--font-script); }
        .font-display { font-family: var(--font-display); }
        .font-serif { font-family: var(--font-serif); }

        .gold-foil-text {
            background: linear-gradient(115deg, #9b681c 0%, #f8e7a1 18%, #c8952d 34%, #fff4c4 48%, #b57c1f 64%, #f2d77e 82%, #9b681c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 1px 10px var(--accent-gold-glow);
            background-size: 180% 100%;
            animation: gold-shimmer 8s ease-in-out infinite alternate;
        }

        @keyframes gold-shimmer {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        .gold-border {
            border-color: var(--accent-gold);
            box-shadow: inset 0 0 0 3px rgba(255, 232, 161, 0.18), 0 0 18px var(--accent-gold-glow);
        }

        .book-viewport {
            perspective: 2200px;
            perspective-origin: 50% 50%;
        }

        .book-container {
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.45s ease;
            filter: drop-shadow(0 22px 26px rgba(25, 2, 13, 0.28));
        }

        .page-sheet {
            background-color: var(--page-bg);
            background-image: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.24), transparent 64%), linear-gradient(110deg, rgba(255, 143, 171, 0.025), transparent 24%, rgba(255, 255, 255, 0.08), transparent 78%);
            border: 1px solid var(--page-border);
            box-shadow: inset 0 0 40px rgba(128, 15, 47, 0.05), inset 0 0 0 5px rgba(255, 255, 255, 0.18), 0 10px 40px var(--paper-shadow);
            transform-style: preserve-3d;
            backface-visibility: hidden;
            transform-origin: left center;
        }

        .right-page::after {
            content: "";
            position: absolute;
            top: 12px;
            right: 4px;
            bottom: 12px;
            width: 2px;
            border-radius: 2px;
            background: linear-gradient(180deg, transparent, var(--accent-gold), var(--accent-pink), var(--accent-gold), transparent);
            opacity: 0.55;
            pointer-events: none;
        }

        .fairytale-cover {
            isolation: isolate;
            background-image: radial-gradient(ellipse at 50% 35%, rgba(255, 180, 201, 0.2), transparent 55%), var(--book-cover-bg) !important;
        }

        .fairytale-cover::before,
        .fairytale-cover::after {
            content: "";
            position: absolute;
            inset: 8px;
            z-index: -1;
            border: 1px solid rgba(255, 225, 151, 0.76);
            border-radius: 0.72rem;
            pointer-events: none;
        }

        .fairytale-cover::after {
            inset: 15px;
            border-color: rgba(255, 225, 151, 0.32);
            border-radius: 0.55rem;
        }

        .cover-sparkles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            color: #ffe7a0;
            text-shadow: 0 0 12px rgba(255, 221, 133, 0.75);
        }

        .cover-sparkles::before,
        .cover-sparkles::after {
            position: absolute;
            font-family: var(--font-serif);
            font-size: 1.1rem;
            letter-spacing: 0.8rem;
            opacity: 0.78;
            content: "✦ · ✧";
        }

        .cover-sparkles::before {
            top: 17%;
            left: 50%;
            transform: translateX(-50%);
        }

        .cover-sparkles::after {
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
        }

        .chapter-ornament {
            height: 1px;
            width: min(10rem, 70%);
            margin: 0.65rem auto 0;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            position: relative;
        }

        .chapter-ornament::after {
            content: "✦";
            position: absolute;
            left: 50%;
            top: 50%;
            padding: 0 0.55rem;
            color: var(--accent-gold);
            background: var(--page-bg);
            transform: translate(-50%, -50%);
            font-size: 0.7rem;
        }

        .corner-cap {
            position: absolute;
            width: 22px;
            height: 22px;
            pointer-events: none;
            z-index: 25;
            opacity: 0.85;
        }
        .corner-top-left { top: 0; left: 0; border-top: 3px solid var(--accent-gold); border-left: 3px solid var(--accent-gold); border-top-left-radius: 6px; }
        .corner-top-right { top: 0; right: 0; border-top: 3px solid var(--accent-gold); border-right: 3px solid var(--accent-gold); border-top-right-radius: 6px; }
        .corner-bottom-left { bottom: 0; left: 0; border-bottom: 3px solid var(--accent-gold); border-left: 3px solid var(--accent-gold); border-bottom-left-radius: 6px; }
        .corner-bottom-right { bottom: 0; right: 0; border-bottom: 3px solid var(--accent-gold); border-right: 3px solid var(--accent-gold); border-bottom-right-radius: 6px; }

        .page-flipper {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            z-index: 35;
            transform-style: preserve-3d;
            transform-origin: left center;
            pointer-events: none;
            display: none;
        }

        .page-flipper.is-turning {
            will-change: transform;
        }

        .page-flipper.single-page-flip {
            width: 100%;
        }

        .page-flipper.flip-prev {
            left: 0;
            transform-origin: right center;
        }

        .page-flipper.flip-next {
            right: 0;
            transform-origin: left center;
        }

        .flipper-face {
            position: absolute;
            inset: 0;
            background-color: var(--page-bg);
            border: 1px solid var(--page-border);
            backface-visibility: hidden;
            overflow: hidden;
            box-shadow: 0 12px 35px var(--paper-shadow);
        }

        .flipper-face.back {
            transform: rotateY(180deg);
        }

        .spine-crease {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 28px;
            z-index: 28;
            pointer-events: none;
        }

        .spine-crease-dual {
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, 
                rgba(89, 13, 34, 0.32) 0%, 
                rgba(89, 13, 34, 0.1) 40%, 
                rgba(89, 13, 34, 0.32) 50%, 
                rgba(89, 13, 34, 0.1) 60%, 
                rgba(89, 13, 34, 0.32) 100%);
        }

        .spine-crease-single {
            left: 0;
            background: linear-gradient(90deg, rgba(89, 13, 34, 0.25) 0%, rgba(89, 13, 34, 0) 100%);
        }

        .ribbon-bookmark {
            position: absolute;
            top: -2px;
            right: 28px;
            width: 24px;
            height: 58px;
            background: linear-gradient(180deg, #ff4d6d 0%, #c9184a 100%);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
            box-shadow: 0 6px 14px rgba(128, 15, 47, 0.4);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 40;
            cursor: pointer;
        }

        .ribbon-bookmark:hover {
            height: 68px;
        }

        .drop-cap::first-letter {
            font-family: var(--font-display);
            font-size: 3.2em;
            float: left;
            line-height: 0.75;
            margin-right: 0.12em;
            margin-top: 0.08em;
            color: var(--accent-pink);
            font-weight: 700;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(201, 24, 74, 0.25);
            border-radius: 4px;
        }

        .dynamic-bend-shadow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.1s linear;
        }

        .eq-bar {
            width: 3px;
            background-color: var(--accent-pink);
            border-radius: 2px;
            animation: eqBounce 1.2s ease-in-out infinite alternate;
        }
        .eq-bar:nth-child(1) { height: 12px; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 18px; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 8px;  animation-delay: 0.2s; }
        .eq-bar:nth-child(4) { height: 15px; animation-delay: 0.4s; }

        @keyframes eqBounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.1); }
        }

        .eq-paused .eq-bar {
            animation-play-state: paused;
            transform: scaleY(0.3);
        }

        #bgCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body {
            background-image:
                radial-gradient(ellipse at 12% 18%, rgba(255, 117, 143, 0.18), transparent 34%),
                radial-gradient(ellipse at 88% 82%, rgba(255, 143, 171, 0.14), transparent 32%);
        }

        body::before,
        body::after {
            position: fixed;
            z-index: 1;
            color: rgba(255, 143, 171, 0.38);
            font-family: var(--font-script);
            pointer-events: none;
            animation: float-heart 6s ease-in-out infinite;
        }

        body::before {
            content: "♡";
            left: 2.5vw;
            top: 18vh;
            font-size: clamp(2rem, 5vw, 4rem);
        }

        body::after {
            content: "♥";
            right: 3vw;
            bottom: 15vh;
            font-size: clamp(1.5rem, 4vw, 3rem);
            animation-delay: -3s;
        }

        @keyframes float-heart {
            0%, 100% { transform: translateY(0) rotate(-8deg); }
            50% { transform: translateY(-12px) rotate(8deg); }
        }

        .music-player-frame {
            display: none;
        }

        #pageHearts {
            position: absolute;
            inset: 0;
            z-index: 31;
            overflow: hidden;
            pointer-events: none;
            border-radius: inherit;
        }

        .page-heart {
            position: absolute;
            color: #ff4d8d;
            font-family: Arial, sans-serif;
            line-height: 1;
            opacity: 0.24;
            pointer-events: auto;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
            text-shadow: 0 2px 12px rgba(255, 77, 141, 0.55);
            animation: page-heart-drift 7s ease-in-out infinite;
            will-change: transform, opacity;
        }

        .page-heart:nth-child(1) { left: 11%; top: 20%; font-size: 23px; animation-delay: -1.4s; }
        .page-heart:nth-child(2) { left: 83%; top: 28%; font-size: 19px; animation-delay: -4.2s; }
        .page-heart:nth-child(3) { left: 18%; top: 76%; font-size: 17px; animation-delay: -2.8s; }
        .page-heart:nth-child(4) { left: 76%; top: 70%; font-size: 25px; animation-delay: -5.5s; }
        .page-heart:nth-child(5) { left: 52%; top: 12%; font-size: 16px; animation-delay: -3.3s; }
        .page-heart:nth-child(6) { left: 60%; top: 88%; font-size: 20px; animation-delay: -0.5s; }
        .page-heart:nth-child(7) { left: 39%; top: 35%; font-size: 15px; animation-delay: -2.1s; }
        .page-heart:nth-child(8) { left: 91%; top: 52%; font-size: 18px; animation-delay: -4.8s; }
        .page-heart:nth-child(9) { left: 7%; top: 54%; font-size: 16px; animation-delay: -0.9s; }

        .page-heart.is-dragging {
            animation: none;
            opacity: 0.95;
            cursor: grabbing;
            z-index: 2;
            filter: drop-shadow(0 0 8px rgba(255, 77, 141, 0.9));
        }

        @keyframes page-heart-drift {
            0%, 100% { opacity: 0.18; transform: translate3d(0, 10px, 0) scale(0.82) rotate(-10deg); }
            50% { opacity: 0.52; transform: translate3d(7px, -14px, 0) scale(1.05) rotate(10deg); }
        }

        .stanza-card {
            position: relative;
            padding: 0.65rem 0.75rem;
            border: 1px solid rgba(201, 24, 74, 0.1);
            border-radius: 0.9rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.55), rgba(255, 204, 213, 0.16));
            box-shadow: 0 5px 16px rgba(89, 13, 34, 0.045);
        }

        .theme-midnight-velvet .stanza-card {
            background: linear-gradient(135deg, rgba(255, 204, 213, 0.08), rgba(89, 13, 34, 0.18));
            border-color: rgba(255, 204, 213, 0.12);
        }

        .theme-vintage-parchment .stanza-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(230, 211, 167, 0.2));
            border-color: rgba(125, 82, 32, 0.12);
        }

        @media (max-width: 640px) {
            body.h-full {
                min-height: 100vh;
                min-height: 100dvh;
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
                overscroll-behavior-y: contain;
            }

            #bookViewport {
                min-height: 0;
                padding: 0.5rem 0.5rem 5.75rem;
            }

            body.tts-active #bookViewport {
                padding-bottom: 11rem;
            }

            #bookStage {
                height: clamp(300px, 62vh, 660px);
                height: clamp(300px, 62dvh, 660px);
                min-height: 0;
                max-height: 660px;
                touch-action: pan-y pinch-zoom;
            }

            header {
                padding-top: max(0.5rem, env(safe-area-inset-top));
            }

            #rightPageSheet {
                border-radius: 1rem;
                border-left-width: 1px;
                border-right-width: 2px;
                box-shadow: inset -5px 0 10px rgba(89, 13, 34, 0.055), inset 0 0 0 5px rgba(255, 255, 255, 0.18), 0 10px 32px var(--paper-shadow);
            }

            #prevEdgeTap,
            #nextEdgeTap {
                display: none;
            }

            .page-heart {
                font-size: 19px;
            }

            .page-heart:nth-child(4) {
                font-size: 22px;
            }

            .page-sheet,
            .flipper-face {
                padding: 0.85rem;
            }

            .page-sheet {
                user-select: text;
                -webkit-user-select: text;
            }

            body.h-full > footer {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                padding: 0.5rem 0.75rem max(0.5rem, env(safe-area-inset-bottom));
                gap: 0.4rem;
                border-top-color: rgba(255, 143, 171, 0.25);
                box-shadow: 0 -10px 30px rgba(28, 5, 18, 0.18);
            }

            #pageNavigation {
                display: grid;
                grid-template-columns: 48px minmax(0, 1fr) 48px;
                gap: 0.5rem;
                align-items: center;
                width: 100%;
            }

            #pageNavigation > button {
                min-width: 44px;
                min-height: 48px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 1px solid rgba(255, 143, 171, 0.38);
                border-radius: 1rem;
                background: linear-gradient(145deg, rgba(255, 77, 141, 0.28), rgba(201, 24, 74, 0.22));
                box-shadow: 0 5px 14px rgba(89, 13, 34, 0.22);
            }

            body.h-full #viewModeBtn {
                display: none;
            }

            #pageNavigation > div {
                max-width: none;
                min-width: 0;
                flex-direction: row;
                gap: 0.5rem;
            }

            #pageNavigation > div > div {
                min-width: 80px;
            }

            #pageScrubber {
                min-height: 24px;
                touch-action: pan-x;
            }

            #ttsControlBar {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            #ttsControlBar > div:last-child {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .page-sheet {
                overscroll-behavior: contain;
                -webkit-overflow-scrolling: touch;
            }
        }

        @media (max-width: 360px) {
            #pageNavigation {
                grid-template-columns: 44px minmax(0, 1fr) 44px;
                gap: 0.35rem;
            }

            #ttsControlBar {
                padding-inline: 0.65rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before,
            body::after,
            .page-heart {
                animation: none;
            }

            #bgCanvas {
                display: none;
            }

            .page-heart {
                opacity: 0.16;
            }

            .gold-foil-text {
                animation: none;
                background-position: 50% 50%;
            }
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between relative overflow-hidden select-none">

    <canvas id="bgCanvas"></canvas>

    <div class="w-full h-1 bg-rose-200/20 fixed top-0 left-0 z-50">
        <div id="readingProgress" class="h-full transition-all duration-300" style="width: 0%; background: linear-gradient(90deg, #ff8fab, #ff4d8d);"></div>
    </div>

    <header class="w-full px-3 sm:px-5 py-2.5 flex items-center justify-between border-b border-rose-900/10 z-40 backdrop-blur-md relative" style="background-color: var(--bg-overlay);">
        <div class="flex items-center space-x-1.5 sm:space-x-3">
            <button id="tocBtn" class="p-2 rounded-xl hover:bg-rose-500/10 transition flex items-center space-x-1.5" title="Table of Contents">
                <i data-lucide="book-open" class="w-5 h-5 text-rose-500"></i>
                <span class="text-xs font-semibold hidden sm:inline">Contents</span>
            </button>
            <button id="bookmarkBtn" class="p-2 rounded-xl hover:bg-rose-500/10 transition flex items-center space-x-1.5" title="Saved Bookmarks">
                <i data-lucide="bookmark" class="w-5 h-5 text-rose-500"></i>
                <span class="text-xs font-semibold hidden sm:inline">Bookmarks</span>
            </button>
        </div>

        <div class="text-center truncate px-2 max-w-[38vw] sm:max-w-md">
            <h1 class="text-xs sm:text-sm font-bold tracking-widest uppercase truncate gold-foil-text font-display">A Lifetime of Silent Devotion</h1>
            <p id="headerChapterName" class="text-[11px] italic opacity-90 truncate gold-foil-text">Dedicated to Sarah</p>
        </div>

        <div class="flex items-center space-x-1 sm:space-x-2">
            <button id="musicToggleBtn" class="px-2.5 py-1.5 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-400/30 transition flex items-center space-x-2" title="Play or pause Sarah's song">
                <div id="eqContainer" class="flex items-end space-x-0.5 h-4 eq-paused">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
                <span id="musicBtnLabel" class="text-[11px] font-bold text-rose-200 hidden md:inline">Sarah</span>
            </button>

            <button id="ttsPlayBtn" class="p-2 rounded-xl hover:bg-rose-500/10 transition flex items-center space-x-1" title="Read Page Out Loud">

                    content: `
                        <div class="text-center mb-4">
                            <span class="font-script text-3xl text-rose-600 block">Dedicated to Sarah</span>
                            <div class="w-16 h-0.5 bg-rose-300 mx-auto my-2"></div>
                        </div>
                        <p class="drop-cap leading-relaxed mb-4">You may see that I do not know about emotion—yes. But as I was writing this book, I tried to learn more about this. And I learned that a man doesn't just protect his woman from the world; he protects her from his own words that burn.</p>
                        <p class="leading-relaxed mb-4">I learned that love is not just a feeling, it is responsibility. I learned that if I claim to love you, then I must be stronger than my pride, gentler than my fear, and more honest than my silence.</p>
                        <blockquote class="border-l-2 border-rose-400 pl-4 italic my-4 text-rose-800/90 font-serif">"I lead her and she returns it. I put effort into her and she mirrors it. That is how love becomes a home, not a wound."</blockquote>

                },
                {

                            <div class="flex justify-between items-baseline border-b border-rose-900/10 pb-1"><span class="font-bold text-sm gold-foil-text">CHAPTER II</span><span class="text-xs italic opacity-70">Gentle Soul Behind the Silence</span><span class="font-bold text-xs">Page 5</span></div>

                            <div class="flex justify-between items-baseline border-b border-rose-900/10 pb-1"><span class="font-bold text-sm gold-foil-text">EPILOGUE</span><span class="text-xs italic opacity-70">Heart Vow to Sarah</span><span class="font-bold text-xs">Page 10</span></div>
                        </div>

                },
                {
                    chapter: "CHAPTER I",
                    type: "poem",
                    title: "July 07, 2024",
                    content: `
                        <div class="text-center mb-4">
                            <h2 class="font-display text-2xl font-bold gold-foil-text">CHAPTER I</h2>
                            <p class="text-xs italic opacity-75">July 07, 2024</p>
                        </div>
                        <div class="space-y-4 leading-relaxed text-rose-900/95 font-serif">
                            <p>On July seventh, twenty-twenty-four,<br>My life was changed forever to the core.<br>Before you came, my heart was dead inside,<br>An empty shell washed up upon the tide.</p>
                            <p>I did not care for anything at all,<br>Just drifting numb, waiting for life to fall.<br>Then suddenly, my eyes searched through the crowd,<br>Ignoring every face and voice too loud.</p>
                            <p>I did not need for you to look at me,<br>Just seeing you was all I wished to see.<br>Your gentle essence woke my heart inside,<br>And brought to light the love I could not hide.</p>
                            <p>On Sunday mornings, how I’d wait and pray,<br>Hoping your presence would brighten up my day.<br>To watch you walk into that quiet place,<br>And feel the sweet essence of your grace.</p>
                        </div>
                    `
                },
                {
                    chapter: "CHAPTER II",
                    type: "poem",
                    title: "Gentle Soul Behind the Silence",
                    content: `
                        <div class="text-center mb-4">
                            <h2 class="font-display text-2xl font-bold gold-foil-text">CHAPTER II</h2>
                            <p class="text-xs italic opacity-75">Gentle Soul Behind the Silence</p>
                        </div>
                        <div class="space-y-4 leading-relaxed text-rose-900/95 font-serif">
                            <p>At first I thought your heart was cold and still,<br>A distant wall I could not reach at will.<br>But looking close, I saw the truth inside:<br>A gentle, tender soul you try to hide.</p>
                            <p>I worked through long and weary nights alone,<br>To earn a small, sweet gift to call my own.<br>Not trying to buy your heart or win your glance,<br>Just letting you know I’m here, given the chance.</p>
                            <p>I threw my foolish pride down to the floor,<br>My dignity meant nothing anymore.<br>I’d lose my self-respect so willingly,<br>If it meant you could feel my loyalty.</p>
                            <p>I tried to write your letters from my heart,<br>But stumbled over words right from the start.<br>I felt so small, so bad at every line,<br>Fearing my clumsy thoughts would never shine.</p>
                        </div>
                    `
                },
                {
                    chapter: "CHAPTER III",

                    content: `
                        <div class="text-center mb-4">
                            <h2 class="font-display text-2xl font-bold gold-foil-text">CHAPTER III</h2>
                            <p class="text-xs italic opacity-75">The Weight of My Remorse</p>
                        </div>
                        <div class="space-y-4 leading-relaxed text-rose-900/95 font-serif">
                            <p>I am so sorry for the tears I caused your eyes to shed,<br>for every single careless word my foolish lips have said.<br>I look back at the past and ask: why did I cause you pain?<br>Why did I break the gentlest heart and leave you in the rain?</p>
                            <p>If I could only turn back time and reach that yesterday,<br>I’d fix every mistake I made and wipe your grief away.<br>I would do everything I could to treat your heart so right,<br>and guard your fragile, sweet soul through every day and night.</p>
                            <p>Instead, this bitter, heavy guilt will hunt me through my days,<br>a dark and quiet shadow that will follow all my ways.<br>There is no valid reason for the damage I have done,<br>I hurt the sweetest, softest soul beneath the morning sun.</p>
                            <p>I hate the foolish, selfish man I proved myself to be,<br>and for the sorrow that I brought, I ask no sympathy.<br>I do not ask to win you back or beg for your embrace,<br>I only want to own my faults and honor your sweet grace.</p>
                        </div>
                    `

                {

                            <h2 class="font-display text-2xl font-bold gold-foil-text">CHAPTER IV</h2>
                            <p class="text-xs italic opacity-75">Rebuilding in the Silence</p>
                        </div>
                        <div class="space-y-4 leading-relaxed text-rose-900/95 font-serif">
                            <p>With God beside my steps, I walk this quiet ground,<br>rebuilding who I am where humble grace is found.<br>I learn new skills each day to make my mind explain,<br>and strive to build a life beneath His guiding hand.</p>
                            <p>Whenever something new or grand comes in my days,<br>I rush with joyful thoughts to tell you right away.<br>Then suddenly I stop, as silence hits me clear,<br>remembering we are gone, and you no longer hear.</p>
                            <p>Yet memories of us still keep my fire bright,<br>a holy, burning flame that warms my lonely night.<br>No woman on this earth could ever take your place,<br>no time can ever fade the soft light of your face.</p>
                            <p>Even if years pass by and you find someone new,<br>my heart’s one true desire stays forever bound to you.<br>I’m breaking down my core, rebuilding from the floor,<br>to be the man of dreams you needed long before.</p>
                        </div>
                    `
                },
                {
                    chapter: "CHAPTER V",
                    type: "poem",
                    title: "You Are My Whole World's Light",
                    content: `
                        <div class="text-center mb-4">
                            <h2 class="font-display text-2xl font-bold gold-foil-text">CHAPTER V</h2>

                        </div>
                        <div class="space-y-4 leading-relaxed text-rose-900/95 font-serif">
                            <p>With God to guide my quiet steps through all the lonely dark,<br>I’ve won so many victories, yet each is just a spark.<br>Though I have gained so much in life and built myself anew,<br>all my success is nothing when I am without you.</p>
                            <p>For my life’s highest victory, its sweetest golden prize,<br>was standing in the softest light that rests inside your eyes.<br>I never asked to hold your hand or beg for anything more,<br>than just to quietly love the soul I sacredly adore.</p>
                            <p>I’d trade my whole tomorrow just to be near your place,<br>to look for one short minute on the beauty of your face.<br>I’d give my final breath and all this empty world bestows,<br>just for the sweet essence that your gentle presence shows.</p>
                            <p>Yet sweeter than a smile that shines so beautiful and bright,<br>your mind is like a sacred garden filled with peace and light.<br>The pure and tender essence of your heart is so refined,<br>the dearest, most precious home my soul will ever find.</p>
                            <p>If I could spend my whole life in your soft and gentle view,<br>I would ask for no other dream on earth to ever come true.<br>For one bright look at you, my entire heart was made,<br>and even forever is a love that will never fade.</p>

                    `

                            <h2 class="font-display text-3xl font-bold gold-foil-text">The Last Poem</h2>
                        </div>
                        <div class="space-y-5 leading-relaxed text-rose-900/95 font-serif text-lg">
                            <p>If I could, I would open my chest and place<br>my heart in your hands, not to shock you,<br>not to prove anything dramatic but so you<br>could feel it yourself.</p>
                            <p>Feel how it trembles at your name.<br>How it races when you come close.<br>How every single beat whispers you.<br>Because maybe then you would understand<br>that this isn’t just love I speak of<br>it’s something carved into me,<br>something that lives and breathes<br>only for you.</p>
                            <p>And if that is too much to bear,<br>then let it be gentle.<br>Let it be quiet.<br>Let it be the kind of love<br>that does not ask to be seen,<br>only to be known.</p>
                            <p>I have loved you in silence,<br>in patience,<br>in the spaces between my breaths,<br>in the ache of remembering<br>your face in every dark room.<br>I have loved you in ways<br>that never needed a stage,<br>only a soul willing to listen.</p>
                            <p>So if this is my final poem,<br>let it be this:<br>I love you without needing<br>to be understood.<br>I love you without asking<br>for anything in return.<br>I love you as a man<br>who has finally stopped running<br>from the truth.</p>
                            <p>And the truth is simple:<br>you are the home<br>my heart kept searching for,<br>the light<br>my soul kept praying for,<br>the grace<br>I never deserved,<br>but somehow received.</p>
                            <p>If I could, I would give you<br>every scar, every prayer,<br>every unfinished sentence,<br>every lonely night,<br>every silent miracle<br>that led me here.<br>Because all of it was only a path<br>back to you.</p>
                            <p>And if this chapter ends here,<br>then let it end with this:<br>I loved you softly,<br>I loved you deeply,<br>I loved you in the dark<br>when no one was watching,<br>and I will love you<br>even when the world goes quiet.<br>Not because I am perfect,<br>but because you are the only truth<br>that ever made me feel real.</p>
                            <p>This is my last poem.<br>And it is yours.</p>
                        </div>
                    `
                },
                {
                    chapter: "EPILOGUE",
                    type: "epilogue",
                    title: "Heart Vow to Sarah",
                    content: `
                        <div class="text-center mb-6">
                            <h2 class="font-script text-5xl text-rose-600">An Eternal Vow</h2>
                            <div class="chapter-ornament"></div>
                        </div>
                        <div class="space-y-4 leading-relaxed text-rose-800/95 font-serif text-base">
                            <p>To Sarah,<br>my quiet sanctuary, my guiding star,<br>and the purest grace I will ever know.<br>May your life be filled with endless peace, warmth,<br>and joy. May every step you take be softened by love,<br>and every dream you hold bloom beautifully before you.</p>
                            <p>I vow to remain faithful in every season of my life,<br>to honour your heart with patience, devotion, and truth.<br>Even when time moves on,<br>even when distance changes the shape of the world,<br>my love for you will remain a quiet constant—<br>steadfast, gentle, and true.</p>
                            <p>For you are not just a chapter in my story,<br>you are the soul I keep returning to.<br>And for as long as my heart beats,<br>I will love you in silence, in devotion,<br>and in the deepest kind of grace.</p>
                        </div>
                    `
                }
            ]
        };

        let currentPageIndex = 0;
        let isDualView = window.innerWidth >= 768;
        let userViewPreference = 'auto';
        let currentTheme = localStorage.getItem('silentDevotionTheme') || 'concert-night';
        let fontSizeScale = parseFloat(localStorage.getItem('silentDevotionFontSize')) || 1.0;
        let bookmarks = JSON.parse(localStorage.getItem('silentDevotionBookmarks')) || [];

        document.body.classList.add(currentTheme === 'soft-rose' ? 'theme-soft-rose' : currentTheme === 'midnight-velvet' ? 'theme-midnight-velvet' : currentTheme === 'vintage-parchment' ? 'theme-vintage-parchment' : '');

        function updateThemeStyles() {
            document.body.classList.remove('theme-soft-rose', 'theme-midnight-velvet', 'theme-vintage-parchment');
            if (currentTheme === 'soft-rose') document.body.classList.add('theme-soft-rose');
            if (currentTheme === 'midnight-velvet') document.body.classList.add('theme-midnight-velvet');
            if (currentTheme === 'vintage-parchment') document.body.classList.add('theme-vintage-parchment');
            localStorage.setItem('silentDevotionTheme', currentTheme);
        }

        function updateFontScale() {
            document.documentElement.style.fontSize = `${fontSizeScale * 100}%`;
            localStorage.setItem('silentDevotionFontSize', fontSizeScale.toString());
            const fontSizeLabel = document.getElementById('fontSizeLabel');
            if (fontSizeLabel) fontSizeLabel.textContent = `${Math.round(fontSizeScale * 100)}%`;
        }

        function renderPage(pageIndex) {
            const leftPage = BOOK_DATA.pages[pageIndex * 2] || null;
            const rightPage = BOOK_DATA.pages[pageIndex * 2 + 1] || null;

            const renderEntry = (page, targetEl, targetFooter, targetNum, isRight) => {
                if (!page) {
                    targetEl.innerHTML = '';
                    targetFooter.textContent = '';
                    targetNum.textContent = '';
                    return;
                }

                const contentMap = {
                    cover: `
                        <div class="fairytale-cover relative h-full w-full rounded-2xl border border-rose-200/50 bg-gradient-to-br from-[#7b1232] via-[#c9184a] to-[#590d22] text-white overflow-hidden p-6 flex flex-col justify-center items-center shadow-2xl">
                            <div class="cover-sparkles"></div>
                            <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_20%,rgba(255,218,148,0.16),transparent_35%)]"></div>
                            <div class="relative text-center z-10">
                                <div class="font-script text-5xl md:text-6xl text-rose-100/95 mb-2">A Lifetime</div>
                                <div class="font-display tracking-[0.25em] text-[11px] uppercase text-rose-200/80 mb-5">of Silent Devotion</div>
                                <div class="font-display text-2xl md:text-3xl font-semibold text-rose-50">${page.title}</div>
                                <div class="w-20 h-px bg-rose-200/80 my-5 mx-auto"></div>
                                <div class="font-serif italic text-rose-100/85 text-base md:text-lg">${page.subtitle}</div>
                                <div class="mt-8 text-[10px] uppercase tracking-[0.5em] text-rose-100/80">${page.dedication}</div>
                            </div>
                        </div>
                    `,
                    intro: `
                        <div class="h-full flex flex-col justify-center">
                            <div class="text-center mb-4">
                                <p class="font-script text-4xl text-rose-600">Dedicated to Sarah</p>
                            </div>
                            ${page.content}
                        </div>
                    `,
                    toc: page.content,
                    poem: page.content,
                    epilogue: page.content
                };

                targetEl.innerHTML = contentMap[page.type] || page.content || '';
                targetFooter.textContent = page.chapter || 'Chapter';
                targetNum.textContent = isRight ? String((pageIndex * 2) + 2) : String((pageIndex * 2) + 1);
            };

            renderEntry(leftPage, leftPageContent, leftChapterFooter, leftPageNum, false);
            renderEntry(rightPage, rightPageContent, rightChapterFooter, rightPageNum, true);
        }

        function updatePageDisplay() {
            const currentPage = currentPageIndex + 1;
            pageIndicator.textContent = `Page ${currentPage} of ${BOOK_DATA.pages.length}`;
            pageScrubber.value = currentPage;
            pageScrubber.max = BOOK_DATA.pages.length;
            renderPage(currentPageIndex);
            const progress = (currentPage / BOOK_DATA.pages.length) * 100;
            readingProgress.style.width = `${progress}%`;
        }

        function nextPage() {
            if (currentPageIndex < BOOK_DATA.pages.length - 1) {
                currentPageIndex += 1;
                updatePageDisplay();
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex -= 1;
                updatePageDisplay();
            }
        }

        function jumpToPage(index) {
            currentPageIndex = Math.min(Math.max(index, 0), BOOK_DATA.pages.length - 1);
            updatePageDisplay();
        }

        document.getElementById('nextBtn').addEventListener('click', nextPage);
        document.getElementById('prevBtn').addEventListener('click', prevPage);
        pageScrubber.addEventListener('input', (e) => jumpToPage(Number(e.target.value) - 1));

        document.getElementById('musicToggleBtn').addEventListener('click', () => {
            const audio = document.getElementById('backgroundSong');
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        });

        document.getElementById('soundToggleBtn').addEventListener('click', () => {
            const soundIcon = document.getElementById('soundIcon');
            soundIcon.classList.toggle('text-rose-300');
            soundIcon.classList.toggle('text-rose-600');
        });

        document.getElementById('themeCustomizerBtn').addEventListener('click', () => {
            document.getElementById('themeDrawer').classList.remove('translate-x-full');
            document.getElementById('themeDrawer').classList.add('translate-x-0');
            document.getElementById('drawerBackdrop').classList.remove('hidden');
        });

        document.getElementById('closeThemeBtn').addEventListener('click', () => {
            document.getElementById('themeDrawer').classList.add('translate-x-full');
            document.getElementById('themeDrawer').classList.remove('translate-x-0');
            document.getElementById('drawerBackdrop').classList.add('hidden');
        });

        document.getElementById('fontIncBtn').addEventListener('click', () => {
            fontSizeScale = Math.min(fontSizeScale + 0.1, 1.5);
            updateFontScale();
        });

        document.getElementById('fontDecBtn').addEventListener('click', () => {
            fontSizeScale = Math.max(fontSizeScale - 0.1, 0.8);
            updateFontScale();
        });

        document.getElementById('fontResetBtn').addEventListener('click', () => {
            fontSizeScale = 1;
            updateFontScale();
        });

        document.querySelectorAll('.theme-select-btn').forEach((button) => {
            button.addEventListener('click', () => {
                currentTheme = button.dataset.theme;
                updateThemeStyles();
            });
        });

        updateThemeStyles();
        updateFontScale();
        updatePageDisplay();
    </script>
</body>
</html>
